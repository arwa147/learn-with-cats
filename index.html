<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn with Cats</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>🐾 Learn with Cats</h1>

        <p>
            Choose a cat and discover fun facts!
        </p>

    </header>



    <!-- Cats -->

    <section class="cards">

        <div class="card" data-cat="leo">

            <img src="leo.jpeg" alt="Leo">

            <h2>Leo</h2>

        </div>



        <div class="card" data-cat="dan">

            <img src="dan.jpeg" alt="Dan">

            <h2>Dan</h2>

        </div>



        <div class="card" data-cat="nala">

            <img src="nala.jpeg" alt="Nala">

            <h2>Nala</h2>

        </div>



        <div class="card" data-cat="hazel">

            <img src="hazel.jpeg" alt="Hazel">

            <h2>Hazel</h2>

        </div>



        <div class="card" data-cat="lily">

            <img src="lily.jpeg" alt="Lily">

            <h2>Lily</h2>

        </div>



        <div class="card" data-cat="milo">

            <img src="milo.jpeg" alt="Milo">

            <h2>Milo</h2>

        </div>



        <div class="card" data-cat="rocky">

            <img src="rocky.jpeg" alt="Rocky">

            <h2>Rocky</h2>

        </div>



        <div class="card" data-cat="mia">

            <img src="mia.jpeg" alt="Mia">

            <h2>Mia</h2>

        </div>



        <div class="card" data-cat="ren">

            <img src="ren.jpeg" alt="Ren">

            <h2>Ren</h2>

        </div>



        <div class="card" data-cat="bella">

            <img src="bella.jpeg" alt="Bella">

            <h2>Bella</h2>

        </div>

    </section>



    <!-- Score -->

    <div class="score">

        ⭐ Score

        <span id="score">0 / 10</span>

    </div>


<script src="data.js"></script>

<script src="script.js"></script>



</body>

</html>
